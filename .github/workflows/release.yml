name: Build and release mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cloud simulation
        run: npm test
      - name: Build from source
        env:
          BUILD_ID: ${{ github.run_number }}.${{ github.sha }}
        run: python mod/build-ci.py --build-id "$BUILD_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ridge-clouds-${{ github.sha }}
          path: |
            mod/build/ci/*.jar
            mod/build/ci/*.sha256
          if-no-files-found: error
      - name: Publish commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${COMMIT}"
          title="Cinematic Drift — build ${COMMIT:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" mod/build/ci/*.jar mod/build/ci/*.sha256 --clobber
          else
            gh release create "$tag" mod/build/ci/*.jar mod/build/ci/*.sha256 --target "$COMMIT" --title "$title" --prerelease --notes "Automatic client mod build from commit $COMMIT for Minecraft 26.3. Requires Fabric, Fabric API and Iris. Generate the Cinematic Drift shader locally using the README instructions; the shader pack is not bundled in this JAR."
          fi
